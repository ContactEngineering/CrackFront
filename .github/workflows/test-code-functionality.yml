name: Test code functionality

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: "0 2 * * 5"
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      matrix:
        python-version: ['3.14']
        mugrid-version: [0.105.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up python3 ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and extension module
        run: |
          set -x
          sudo apt-get update -qy
          sudo apt-get install -y python3-dev python3-venv libfftw3-dev libopenblas-dev libhdf5-dev libnetcdf-dev
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install flit numpy pip-tools setuptools wheel
          python3 -m pip install -v --no-binary muGrid muGrid==${{ matrix.mugrid-version }}
          python3 -m pip install -v .[test]

      - name: Test with pytest
        run: |
          source venv/bin/activate
          python3 -m pytest --verbose --full-trace -s
